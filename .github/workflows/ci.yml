# Type check, ESLint, Stylelint, format check, knip, unit tests and the build on every pull
# request and every push to main. The papi descriptors are code-generated OFFLINE from the committed
# .papi/metadata, so CI needs no chain access.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per ref on a branch); superseded runs are cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate papi descriptors (offline, from committed metadata)
        run: npx papi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

      - name: Unused code
        run: npm run knip

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
